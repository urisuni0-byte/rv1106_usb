# scannerd 설정 - /opt/scanner/scanner.conf
# 값을 바꾼 뒤에는  /etc/init.d/S96scanner restart
# (셸 형식 KEY=VALUE. scannerd 와 init 스크립트가 함께 읽는다)

# ---- 장치 정보 (BLE Device Info, mDNS TXT, /api/device)
# 장치 이름 = NAME_PREFIX-<Wi-Fi MAC 뒤 4자리>, 장치 식별자 = Wi-Fi MAC 12자리
NAME_PREFIX=TGOABC
MODEL=TGO-ABC-S1
FW_VERSION=0.1.0

# ---- HTTP (상태 확인, WebRTC 시그널링, JPEG 다운로드)
HTTP_PORT=8090

# ---- 카메라
# 비워두면 UVC 카메라 노드를 자동으로 찾는다
CAMERA_DEVICE=
# 실시간 미리보기: 카메라 YUYV -> RV1106 하드웨어 H.264 (Baseline, CBR)
#   B0292(IMX219) 의 YUYV: 640x480@20, 1280x720@15 (목록: camhelper list)
#   어두우면 카메라가 프레임을 낮춘다 -> 카메라 설정의 '어두우면 프레임 낮추기' 끄기
PREVIEW_WIDTH=640
PREVIEW_HEIGHT=480
PREVIEW_FPS=20
PREVIEW_KBPS=2000
# 정지영상: 카메라 MJPEG 를 그대로 저장 (일반광 1장 + UV광 1장)
#   B0292: 2592x1944(5MP) / 3264x2448(8MP, 15fps)
#   카메라 목록에 없는 크기면 드라이버가 가까운 크기로 바꿔 찍는다 -> camhelper list 로 확인
PHOTO_WIDTH=2592
PHOTO_HEIGHT=1944
# 조명을 바꾼 뒤 노출이 따라오도록 버리는 프레임 수
PHOTO_SKIP=4
# MIPI 렌즈 AF 탐색 범위 "최소-최대" (VCM 0~1023, 클수록 가까운 곳). 비우면 전체. 촬영 거리가 스페이서로
# 정해져 있으면 그 근처만 훑어 AF 가 빨라진다 (IMX708 + 접사 통: 맞는 위치 약 100~400)
AF_RANGE=
# MIPI 렌즈 AF 방식: far = 먼 쪽 우선 (두피 위에 뜬 모발 대신 두피에 맞춘다), best 또는 비우면 가장 선명한 곳
AF_PRIORITY=far
# MIPI 렌즈 AF 시점: continuous = 미리보기 중에 맞춰 두고 흐려지면 다시 맞춤, 촬영은 AF 없이 바로
#                   snap = 촬영할 때마다 맞춤. 앱에서 "자동 초점"을 끄면 그때 위치로 고정된다
AF_MODE=continuous
# 촬영 버튼: 0 = 일반광 1장만, 1 = 일반광 + UV광 2장 (연동 시나리오 원안)
CAPTURE_UV=0

# ---- 조명 / 버튼 (sysfs GPIO 번호, -1 = 없음 -> 시뮬레이션)
# RV1106 GPIO 번호 = bank*32 + group*8 + pin  (예: GPIO1_C7 = 1*32 + 2*8 + 7 = 55)
WHITE_LED_GPIO=-1
UV_LED_GPIO=-1
LED_ACTIVE_LOW=0
BUTTON_GPIO=-1
BUTTON_ACTIVE_LOW=1

# ---- 온·습도 센서: sim | sht3x | none
SENSOR=sim
SENSOR_I2C_BUS=3
SENSOR_I2C_ADDR=0x44

# ---- 촬영 저장
DATA_DIR=/userdata/scanner
CAPTURE_KEEP=20

# ---- BLE (GATT 프로비저닝)
BLE=1
# HCI 번호. -1 = 처음 보이는 장치 (컨트롤러를 다시 붙이면 hci1 처럼 번호가 바뀔 수 있다)
BLE_HCI=-1
# HCI 장치가 없을 때 먼저 실행할 명령 (블루투스 컨트롤러를 올리는 보드별 명령)
BLE_INIT=
# HCI 를 계속 못 열 때 컨트롤러를 다시 붙이는 명령 (Luckfox Pico Ultra W: AIC8800 BT 가 ttyS1 UART)
BLE_RESET="killall hciattach; sleep 1; hciattach -s 1500000 /dev/ttyS1 any 1500000 flow nosleep; sleep 2"

# ---- mDNS / DNS-SD (자동 재연결)
MDNS=1
MDNS_SERVICE=_tgoabc._tcp

# ---- Wi-Fi (STA 접속은 보드의 rvcam-net.sh 가 한다. AP RvCam-xxxx 는 항상 유지)
NET_SCRIPT=/usr/bin/rvcam-net.sh
NET_CFG_DIR=/userdata/rvcam
STA_IF=wlan0
