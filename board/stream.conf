# uvc_stream 설정 - start.sh 와 init 스크립트(S95uvcstream)가 함께 읽는다.
# 값을 바꾼 뒤에는  /etc/init.d/S95uvcstream restart

# 카메라 노드. 비워두면 MJPEG 를 지원하는 UVC 노드를 자동 탐색한다.
DEVICE=""

# 해상도 / 프레임레이트 (카메라가 실제로 알려 주는 MJPEG 목록 - 데이터시트와 다름)
#   30fps: 2320x1744, 1920x1080, 1600x1200, 1280x720, 800x600, 640x480, 320x240
#   10fps: 4656x3496, 3840x2160, 2592x1944
# 1920x1080@30: 보드 AP(2.4GHz ch6) 경유 패드에서 ~28fps, ~18 Mbps 측정.
# 보드는 MJPEG 를 디코딩하지 않고 그대로 내보내므로 CPU 부하는 해상도와 거의 무관하다.
WIDTH=1920
HEIGHT=1080
FPS=30

# 패드에서 접속할 포트 (8080 은 RvCam 프로비저닝 API 가 쓴다)
PORT=8090

# 바인딩 주소
BIND=0.0.0.0

# V4L2 캡처 버퍼 개수
BUFFERS=4

# 사진(POST /photo) 최대 해상도 WxH - 이 면적 이하에서 가장 큰 MJPEG 해상도를 고른다.
#   3840x2160 (8.3MP, 16:9) 1.6~2.1s / 0 이면 4656x3496 (16MP, 4:3) / 2592x1944 (5MP, 4:3)
# 16MP 는 촬영 순간 free 가 ~10MB 까지 내려간다.
PHOTO_MAX=2592x1944

# 카메라 내장 마이크 (/audio.wav)
AUDIO=1
AUDIO_RATE=48000

# WebRTC(H.264) 송출. 이 보드 이미지에는 GStreamer 가 없어서 끈다.
WEBRTC=0
